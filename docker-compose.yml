version: '3.8'

services:
  image-classifier:
    build: .
    container_name: image-classifier
    ports:
      - "8000:8000" # api
      - "8001:8001" # metrics


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090" 
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'