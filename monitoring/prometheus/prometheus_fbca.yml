# prometheus service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: image-classifier

# cluster role 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus

rules:
- apiGroups: [""]
  resources:
  - nodes 
  - nodes/proxy 
  - nodes/metrics  
  - services       
  - endpoints
  - pods          
  verbs: ["get", "list", "watch"]

# networking resources
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

# direct access to metrics
- nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
  verbs: ["get"]

# bind cluster role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: image-classifier 